<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable | Auryel</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .nf-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px}
  .nf-logo{font-family:'Cinzel Decorative',Georgia,serif;font-size:14px;letter-spacing:.3em;color:var(--gold);text-decoration:none;text-transform:uppercase;margin-bottom:48px}
  .nf-code{font-family:'Cinzel',Georgia,serif;font-size:clamp(48px,8vw,88px);font-weight:400;color:var(--gold-b);line-height:1;margin-bottom:8px}
  .nf-title{font-family:'Cinzel',Georgia,serif;font-size:clamp(22px,3vw,32px);font-weight:400;color:var(--cream);margin-bottom:20px}
  .nf-text{font-family:'Lora',Georgia,serif;font-size:15px;font-weight:300;color:var(--cs);max-width:460px;line-height:1.9;margin-bottom:36px}
  .nf-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
</style>
</head>
<body>
<div class="nf-wrap">
  <a href="/" class="nf-logo">Auryel</a>
  <div class="nf-code">404</div>
  <h1 class="nf-title">Cette page n'existe pas</h1>
  <div class="rule" style="margin:0 auto 28px"></div>
  <p class="nf-text">La page que vous cherchez a été déplacée ou n'existe plus. Revenez à l'accueil pour retrouver votre chemin.</p>
  <div class="nf-actions">
    <a href="/" class="cta-p">Retour à l'accueil</a>
    <a href="/application" class="cta-g">Découvrir l'application</a>
  </div>
</div>
</body>
</html>
