# Netlify — auryelvoyance.com
# Backend Flask sur Railway (auryel_bot.py ignoré par Netlify)

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'"

# ── Redirects 301 : nettoyage index.html ────────────────────────────────────
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

