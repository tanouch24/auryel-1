# Netlify — auryelvoyance.com
# Backend Flask sur Railway (auryel_bot.py ignoré par Netlify)

[build]
  command = "bash netlify-build.sh"
  publish = "_site"

# ── Domaine canonique sans www ─────────────────────────────────────────────
[[redirects]]
  from = "https://www.auryelvoyance.com/*"
  to = "https://auryelvoyance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.auryelvoyance.com/*"
  to = "https://auryelvoyance.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'"

# ── Blocage fichiers sensibles (wildcards) ──────────────────────────────────
[[redirects]]
  from = "/*.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  force = false

[[redirects]]
  from = "/*.txt"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/requirements.txt"
  to = "/404"
  status = 404
  force = true

# ── Proxy API backend Railway ───────────────────────────────────────────────
[[redirects]]
  from = "/stripe/*"
  to = "https://web-production-93330.up.railway.app/stripe/:splat"
  status = 200
  force = true

# ── Redirects 301 : nettoyage index.html ────────────────────────────────────
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ── Anciennes entrées : transfert vers l’application ───────────────────────
[[redirects]]
  from = "/inscription"
  to = "/application"
  status = 301
  force = true

[[redirects]]
  from = "/inscription/"
  to = "/application"
  status = 301
  force = true

[[redirects]]
