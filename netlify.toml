# Netlify — auryelvoyance.com
# Backend Flask sur Railway (auryel_bot.py ignoré par Netlify)

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Redirects 301 : nettoyage index.html ────────────────────────────────────
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

